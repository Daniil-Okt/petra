<div class="grat review" data-aos="fade-right">
    <div class="review__body pt-sec pb-sec" data-aos="fade-right">
        <div class="review__fon prod__fon pos-ab-cover prl-fon">
            <div class="img">
                <picture class="lazy pos-ab-cover">
                    <source media="(max-width: 575px)" data-srcset="@img/review/rev-fon-mob.png">
                    <source media="(max-width: 1024px)" data-srcset="@img/review/rev-fon-pl.png">
                    <img class="cover" data-src="@img/review/rev-fon.png">
                </picture>
            </div>
        </div>
        <div class="review__container">
            <h2 class="review__title bs-title m-b a-c">
                ПОСМОТРИТЕ ОТЗЫВЫ НАШИХ КЛИЕНТОВ
            </h2>

            <div class="review__top">
                <div class="grat__pagin pagin gray">
                    <div class="grat__btn-prev pagin__btn-prev pagin__btn"></div>
                    <div class="grat__pagin-number pagin__number">1</div>
                    <div class="grat__btn-next pagin__btn-next pagin__btn"></div>
                </div>
            </div>
            
            <div class="grat__row">
                <div class="grat__video video-play">
                    <video class="lazy" playsinline preload="metadata">
                        <source  data-src="static/showreel.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="grat__right">
                    <div class="grat__slider">
                        <div class="grat__wrapper swiper-wrapper">
                            <div class="grat__slide swiper-slide">
                                <img loading="lazy" class="lazy" data-src="@img/grat/grat-img1.png" alt="">
                            </div>
                            <div class="grat__slide swiper-slide">
                                <img loading="lazy" class="lazy" data-src="@img/grat/grat-img2.png" alt="">
                            </div>
                            <div class="grat__slide swiper-slide">
                                <img loading="lazy" class="lazy" data-src="@img/grat/grat-img1.png" alt="">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
