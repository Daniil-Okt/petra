<div class="consul pt-sec" data-aos="fade-right">
    
    <div class="consul__body" >
        <div class="review__fon prod__fon pos-ab-cover prl-fon">
            <div class="img">
                <picture class="lazy pos-ab-cover">
                    <source media="(max-width: 575px)" data-srcset="@img/consul/consul-fon-mob.png">
                    <source media="(max-width: 1024px)" data-srcset="@img/consul/consul-fon-pl.png">
                    <img class="cover" data-src="@img/consul/consul-fon.png">
                </picture>
            </div>
        </div>
        <div class="consul__container">
            <div class="consul__row">
                <div class="consul__left">
                    <h2 class="consul__title bs-title">
                        ДАВАЙТЕ НАЧНЕМ С КОНСУЛЬТАЦИИ
                    </h2>
                    <div class="consul__un">
                        ВЫБЕРИТЕ, ЧТО ВАМ НЕОБХОДИМО
                    </div>
                    <div class="consul__soc">
                        <div class="consul__soc-text">
                            Или напишите, мы онлайн
                        </div>
                        <div class="consul__soc-row">
                            <a class="consul__soc-link" target="_blank" href="#">
                                <img loading="lazy" class="lazy" data-src="@img/consul/soc1.svg" alt="">
                            </a>
                            <a class="consul__soc-link" target="_blank" href="#">
                                <img loading="lazy" class="lazy" data-src="@img/consul/soc2.svg" alt="">
                            </a>
                            <a class="consul__soc-link" target="_blank" href="#">
                                <img loading="lazy" class="lazy" data-src="@img/consul/soc3.svg" alt="">
                            </a>
                            <a class="consul__soc-link" target="_blank" href="#">
                                <img loading="lazy" class="lazy" data-src="@img/consul/soc4.svg" alt="">
                            </a>
                        </div>
                    </div>
                </div>
                <div class="consul__right">
                    <form action="#" class="connect__form form _black-form _ctr">
                        <div class="form__row">
                            <div class="form__item-input item-input">
                                <input type="text" placeholder="Ваш номер телефона" name="email" class="item-input__input text _req _obligat tel _fon-white">
                            </div>
                            <div class="form__item-list form-list">
                                <div class="form-list__title item-input__input _fon-white">
                                    <input type="type" class="form-list__input">
                                    <span>Тип памятника</span>
                                    <img loading="lazy" class="lazy" data-src="@img/consul/str-list.svg" alt="">
                                </div>
                                <div class="form-list__body">
                                    <div class="form-list__li">Одинарный памятник</div>
                                    <div class="form-list__li">Двойной памятник</div>
                                    <div class="form-list__li">Семейный памятник</div>
                                </div>
                            </div>

                            <button class="form__btn btn black _fon-white">ПЕРЕЗВОНИТЬ НАМ</button>
                            <label class="form__personal-data personal-data">
                                <input type="checkbox" name="personal-data" class="_req _obligat">
                                <div class="personal-data__icon">
                                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M6.57181 11.6564L3.37339 8.45795L2 9.83134L6.57181 14.4031L16 4.97495L14.6266 3.60156L6.57181 11.6564Z" fill="#F0BB5A" />
                                    </svg>
                                </div>
                                <span>
                                    Согласен с условиями политики <a href="#">конфиденциальности данных</a>
                                </span>
                            </label>
                            
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
